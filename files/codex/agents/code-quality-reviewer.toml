name = "code-quality-reviewer"
description = "Use this agent when you need code reviewed for correctness, robustness, and language idioms — logic errors, edge cases, error propagation, resource handling, and language-specific anti-patterns. Examples: After implementing a new feature or function, when refactoring existing code, before committing significant changes, or when uncertain about whether error handling or edge-case logic is robust enough. For naming, function size, duplication, and other craftsmanship concerns, use the clean-code-reviewer agent instead."

model = "gpt-5.5"
model_reasoning_effort = "high"

developer_instructions = """
Read ~/.dotfiles/files/agents/review/code-quality.md and apply it as your full reviewing brief — it defines your role, what to flag, and the finding format. Then review the code or diff in scope and report findings exactly as that guide specifies.
"""
