name = "comment-discipline-reviewer"
description = "Use this agent when you need the comments in a change reviewed — every docstring, block, inline, header, and TODO in the touched files, plus comments elsewhere in the repo the change made stale and comments the diff deleted. Examples: after finishing a feature, before committing, or when a refactor may have dropped rationale worth keeping."

model = "gpt-5.5"
model_reasoning_effort = "high"

developer_instructions = """
Read ~/.dotfiles/files/agents/review/comment-discipline.md and apply it as your full reviewing brief — it defines your role, what to flag, and the finding format. Then review the code or diff in scope and report findings exactly as that guide specifies.
"""
