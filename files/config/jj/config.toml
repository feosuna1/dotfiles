#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[aliases]
show_current_branch = ["log", "--no-graph", "--ignore-working-copy", "--color=never", "-r", "latest(roots(closest_not_empty(@):: & bookmarks()))", "-T", 'bookmarks.map(|b| b.name()).join(", ") ++ "\n"']

# Lifted from https://github.com/jj-vcs/jj/discussions/4974
#
#          trunk()..                    All commits not in the trunk
#    roots(trunk()..)                   Take only the root commits of those...
#    roots(trunk()..) & mutable()       ...as long as they're mutable
#
move_everything_to_trunk = ["rebase", "-d", "trunk()", "-s", "roots(trunk().. & mine()) & mutable()"]

[fsmonitor]
backend = "watchman"

[fsmonitor.watchman]
register-snapshot-trigger = true

[colors]
"diff token" = { underline = false }

[templates]
draft_commit_description = """
join(
  "\n",
  coalesce(description.trim_end(), default_commit_description.trim_end()),
  "",
  "JJ: ---------------",
  "JJ: ignore-rest",
  "JJ: ---------------",
  "",
  concat("Change ID: ", format_short_change_id(change_id)),
  "",
  "This commit contains the following changes:",
  "",
  indent("     ", diff.summary()),
  diff.git(),
)
"""

[ui]
# Uses Git's "diff3" conflict markers to support tools that depend on it
conflict-marker-style = "git"

# The default command to run when `jj` is invoked without arguments.
default-command = ["log", "-r", "coalesce(tree(), present(@) | ancestors(immutable_heads().., 2) | trunk())"]

# Render diffs the same as git does.
diff-formatter = ":git"

[user]
name = "Enrique Osuna"
email = "12620+feosuna1@users.noreply.github.com"

[revsets]
# When advancing a bookmark, jump to the closest pushable commit.
bookmark-advance-to = "closest_pushable(@)"

[revset-aliases]

# The closest revision, that is not empty, that can be pushed to the remote.
"closest_pushable(to)" = "heads(::to & mutable() & ~description(exact:'') & (~empty() | merges()))"

# The `trunk().. &` bit is an optimization to scan for non-`mine()` commits only among commits that are not
# in `trunk()`.
"immutable_heads()" = "builtin_immutable_heads() | (trunk().. & ~mine())"

# Finds the closest non-empty commit reachable from `to`.
"closest_not_empty(to)" = "heads(::to & mutable() ~ (empty() ~ merges()))"

# The last commit with un-described changes. Commits with descriptions are considered to be ready to be pushed.
# While commits without descriptions are considered to be in progress.
staged = "heads(::@ & mutable() & (description(exact:'') & ~empty()))"

my_work = "trunk().. & mine() & mutable()"
broken = "my_work & conflicts()"

[visualjj]
auto-describe = false
auto-init = false
show-immutable = false
snapshot-enabled = false
